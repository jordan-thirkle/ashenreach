name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'README.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify Vercel output exists
        shell: bash
        run: test -s .vercel/output/config.json
