# Disabled: Vercel handles all deployments for ashenreach.
# CI workflow already verifies Vercel output exists.
# This GitHub Pages deployment is redundant.
name: Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Disabled (Vercel handles deployments)
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deployments handled by Vercel"
